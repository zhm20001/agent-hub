<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c47a12'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Hub</title>
    <meta name="description" content="Agent Hub — dispatch coding agents, observe detached runners on the board, stream viewer, Git diff, and task roster." />
    <meta property="og:title" content="Agent Hub" />
    <meta property="og:description" content="Agent Hub — dispatch coding agents, observe detached runners on the board, stream viewer, Git diff, and task roster." />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('agent-hub-theme');
          if (t !== 'light' && t !== 'dark') t = 'light';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body class="bg-page text-ink antialiased min-h-screen font-sans">
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
